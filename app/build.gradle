apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace "com.example.disasterapp"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.disasterapp"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        // manifestPlaceholders for sensitive keys (set via gradle.properties or CI secrets)
        manifestPlaceholders = [ MAPS_API_KEY: project.hasProperty('MAPS_API_KEY') ? project.MAPS_API_KEY : "" ]
    }

    signingConfigs {
        // Placeholder signing config. To sign release builds in CI, set the following repo secrets and
        // configure the workflow to inject them as gradle properties or decode the keystore file.
        // - KEYSTORE_BASE64 (base64-encoded keystore)
        // - KEYSTORE_PASSWORD
        // - KEY_ALIAS
        // - KEY_PASSWORD
        // If you don't supply these, builds will be unsigned (useful for local testing).
        release {
            // Example (commented):
            // storeFile file("keystore.jks")
            // storePassword project.hasProperty('KEYSTORE_PASSWORD') ? project.KEYSTORE_PASSWORD : ''
            // keyAlias project.hasProperty('KEY_ALIAS') ? project.KEY_ALIAS : ''
            // keyPassword project.hasProperty('KEY_PASSWORD') ? project.KEY_PASSWORD : ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE']
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation 'androidx.core:core-ktx:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.3'

    // Google Maps
    implementation 'com.google.android.gms:play-services-maps:18.1.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'

    // Retrofit / OkHttp / Gson
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.8.1'

    // Media
    implementation 'androidx.media:media:1.7.0'

    // Notifications
    implementation 'androidx.core:core:1.11.0'

    // Testing (optional)
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
