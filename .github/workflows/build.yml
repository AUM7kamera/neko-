name: Android CI - Build AAB & APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Decode keystore (if provided)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ./keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Show Java and Gradle info
        run: |
          java -version
          ./gradlew -v

      - name: Build AAB (bundleRelease) and APK (assembleRelease)
        run: |
          GRADLE_PROPS=""
          if [ -n "${MAPS_API_KEY:-}" ]; then
            GRADLE_PROPS="$GRADLE_PROPS -PMAPS_API_KEY=${MAPS_API_KEY}"
          fi
          if [ -f "./keystore.jks" ]; then
            GRADLE_PROPS="$GRADLE_PROPS -PKEYSTORE_FILE=keystore.jks -PKEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-} -PKEY_ALIAS=${KEY_ALIAS:-} -PKEY_PASSWORD=${KEY_PASSWORD:-}"
          fi
          echo "Gradle properties: $GRADLE_PROPS"
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace $GRADLE_PROPS
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: List outputs
        run: |
          ls -la app/build/outputs/bundle/release || true
          ls -la app/build/outputs/apk/release || true

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload APK artifact(s)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*-universal.apk

  release-on-tag:
    name: Create Release and attach artifacts
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-release-apks
          path: artifacts

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
